[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paired-inr-pdlk"
version = "0.2.0.dev0"
description = "Paired implicit neural image trajectories with shared-grid differential LK registration"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "numpy>=1.24",
  "scipy>=1.10",
  "Pillow>=10",
  "tqdm>=4.66",
  "nibabel>=5.2",
  "surface-distance @ git+https://github.com/google-deepmind/surface-distance.git@1f805cea446805e559badc80dd27f34175e4173d",
]

[project.optional-dependencies]
acdc = ["scikit-image>=0.22", "MedPy>=0.5", "SimpleITK>=2.3"]
brain-protocols = ["composable-mapping==0.1.2", "deformation-inversion-layer==1.1.2"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["medical*", "baselines*"]
namespaces = false
exclude = ["medical.results*", "medical.tests*", "baselines.upstream*", "baselines.tests*", "baselines.results*"]

[tool.setuptools.package-data]
medical = ["configs/*.json", "protocols/*.json", "protocols/LICENSE.*.txt"]
baselines = ["sources.json", "audit.json", "AUDIT.md", "configs/*.json", "patches/*.patch", "requirements.txt", "README.md"]
